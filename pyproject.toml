[project]
name = "dog-radar-vitals"
version = "0.1.0"
description = "レーダ信号からイヌのバイタルサイン（心拍数・呼吸数、将来的にRR Interval・ECG波形）を推定するモデルの実験リポジトリ"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "scipy>=1.10",
    "ncps>=1.0.1",
    "torch_geometric>=2.5",
    "neurokit2>=0.2.7",
    "ptflops>=0.7",
    "ssqueezepy>=0.6.6",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
    "pillow>=12.2.0",
    "soundfile>=0.14.0",
    "librosa>=0.11.0",
    "bitsandbytes>=0.50.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
