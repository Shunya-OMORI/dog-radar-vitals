# 277: 274(R波単独教師のneurokit2本番モデル, F1 0.551/RR-MAE 10.69ms/RMSSD-MAE 16.27ms)
# と同一構成だが、教師heatmapをR波単独ではなくR波+T波の統合(rpeak_detector: neurokit_rt)
# にする。276の8epochプローブで、旧手法(閾値0.3)でF1 0.519/RR-MAE 10.43ms、paired_dedup
# でF1 0.531/RR-MAE 10.41ms(274のRR-MAEに匹敵、わずか8epochで)という有望な結果が出た
# ため、単一変数の原則(CLAUDE.md R4, 変更点はdata.rpeak_detectorのみ)を保ったまま
# 本番エポック数で確定させる(R2)。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  rpeak_detector: neurokit_rt
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
