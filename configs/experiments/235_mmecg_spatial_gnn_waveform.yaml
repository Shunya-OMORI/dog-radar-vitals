# 235: RCG(mmWave, 50ch) + posXYZ -> ECG波形推定。空間GNN（231のSelf-Attention版に対し、
# posXYZの実距離によるk近傍グラフ+GATConvでメッセージパッシングする、より物理的に妥当な
# 空間帰納バイアス。MMPoint-GNN(Gong et al. 2021)等のmmWave point cloud向けGNN研究に着想）。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: ecg_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
