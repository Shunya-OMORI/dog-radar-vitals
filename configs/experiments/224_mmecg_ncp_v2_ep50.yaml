# 224: RCG(mmWave, 50ch) -> ECG波形推定。NCP v2。207はepochs=15（NCPの学習コストが
# 1epoch≈5.5分と重いための暫定措置）で打ち切っていたが、精度追求フェーズにつき他モデルと
# 同じepochs=50に揃えて再学習し、公平な比較にする。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  complex_input: false
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_seq2seq
  name: ecg_ncp
  in_channels: 50
  units: 64
  output_dim: 1

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
