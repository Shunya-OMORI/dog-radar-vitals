# 274: 236(元の空間GNN, 50epoch)と同一構成だが、R波正解ラベルをneurokit2(恒久対応)で
# 再検出する。273の8epochプローブでF1 0.510->0.549, RMSSD-MAE 20.90->18.06ms(改善)、
# RR-MAE 10.27->10.91ms(わずかに悪化)という結果が出たため、本番epoch数で確定させる。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  rpeak_detector: neurokit
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
