# 302: 301(MAD正規化 + 正例重み付きBCE)を本番epoch数で 11-fold LOSO に掛ける。
# 301の10epochプローブ(同一split, test 17/29/30):
#   h=0.5 で F1@150ms 0.908 / MDR 8.70% / RR間隔MAE 9.33ms / RMSSD誤差 17.85ms / SDNN誤差 4.61ms
#   h=0.3〜0.6 のどこでも F1@150ms 0.889〜0.908 と平坦(284では動作点を動かすと片方が崩れた)
# 比較: 284(LOSO) F1@150ms 0.729 / MDR 33.40% / RMSSD誤差 16.94ms
#       295(LOSO) F1@150ms 0.847 / MDR 12.13% / RMSSD誤差 17.99ms
#       radarODE   MDR 4.31%
#       一定RRのみ                            RMSSD誤差 41.83ms
# 302: MAD正規化(299) + 正例重み付きBCE(295) の組み合わせ。10 epoch のプローブ。
# 単独効果は測り終えている:
#   MAD正規化(299, 10epoch, 同一split)      : F1@150ms 0.847 / MDR 16.92% / RR間隔MAE 9.58ms / RMSSD誤差 16.60ms
#   pos_weight=10(295, 50epoch, 11-fold LOSO): F1@150ms 0.847 / MDR 12.13% / RMSSD誤差 17.99ms
#   284(z-score+通常BCE, 50epoch, LOSO)      : F1@150ms 0.729 / MDR 33.40% / RMSSD誤差 16.94ms
#   (参考) 入力を見ずに一定RRを出すだけ        : RMSSD誤差 41.83ms
# 両者は「モデルは拍を見つけているのに確信度が出せない」という同じ症状に、
# 前処理側と損失側から別々に効いている。組み合わせが加算的かを確かめる。
#
# **これは R4(単一変数)の対象外。** 切り分けは各単独実験で済んでおり、ここは最良構成を作る段階。
# 両方とも出力を高くする方向なので precision が落ちてしきい値の最適点がずれるはず。
# しきい値の選び直しとセットで評価すること。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  rpeak_detector: neurokit
  normalization: robust
  heatmap_sigma_ms: 15.0
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
  loss: weighted_bce
  pos_weight: 10.0
