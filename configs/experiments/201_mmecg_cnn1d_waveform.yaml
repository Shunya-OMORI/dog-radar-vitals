# 201: RCG(mmWave, 50ch) -> ECG波形推定。既存の101(ecg_cnn1d、Schellenberger/CW radar)と
# 同じ全畳み込み1D CNNをin_channels=50でそのまま流用する（CNNベースライン）。
#
# 番号帯の意味: 201- はMMECG（mmWave、拍単位RR Interval・ECG波形予測、本題拡張）。AGENTS.md参照。
# 11被験者を7/1/3で分割（トライアル単位ではなく被験者ID単位。data/raw/README.md参照）。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4 # 4秒窓 = fs(200Hz)*4 = 800サンプル
  stride_sec: 2
  complex_input: false
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_seq2seq
  name: ecg_cnn1d
  in_channels: 50
  channels: 64
  n_layers: 6
  kernel_size: 15
  dropout: 0.1

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
