# 209: RCG(mmWave, 50ch)のanalytic signal(Hilbert変換)-> ECG波形推定。
# 本命モデルの1つ、複素領域CNN。201-208と同一データ・split・windowだが、
# complex_input: true でHilbert変換したanalytic signalを入力する点のみ異なる。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  complex_input: true
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_seq2seq
  name: ecg_complex_cnn
  in_channels: 50
  channels: 32
  n_layers: 6
  kernel_size: 15

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
