# 219: RCG(mmWave, 50ch) -> R波heatmap推定。Conformer型(218のheatmap版)。
# 204のrpeak_transformerが未収束(F1=0)だった問題の再設計版。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  complex_input: false
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_rpeak_seq2seq
  name: rpeak_conformer
  in_channels: 50
  d_model: 128
  conv_kernel_size: 15
  conv_layers: 3
  n_heads: 4
  n_transformer_layers: 4
  dim_feedforward: 256
  dropout: 0.1

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
  scheduler:
    type: warmup_cosine
    warmup_epochs: 5
