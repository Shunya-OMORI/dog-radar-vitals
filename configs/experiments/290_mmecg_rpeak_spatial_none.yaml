# 290 (2026-08-24): 284 から **50点の混ぜ方だけ**を変えた対照。
# spatial_aggregation: none  (混ぜない(平均プーリングのみ))
# 目的: 先輩からの「なぜ GNN か、何をグラフにしたのか」に対照実験で答える。
# 点ごとエンコーダ・位置埋め込み・時間デコーダ・教師・後処理は 284 と完全に同一(R4)。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  rpeak_detector: neurokit
  heatmap_sigma_ms: 15.0
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2
  spatial_aggregation: none

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
