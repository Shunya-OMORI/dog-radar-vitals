# 270: 269(backbone 2段downsampling+Anchor補助タスク、25epoch)がtest_corr=0.300を達成し、
# 268(同構成・旧3段downsampling、test_corr=0.254)・248(旧アーキテクチャ、80epoch、
# test_corr=0.258)のいずれも上回った。25epochの短縮検証だったため、248と同じ80epochで
# フル学習し、時間分解能改善の効果が長期学習でも維持されるかを確認する。
seed: 42
task: ecg

data:
  raw_root: data/raw
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_radarode_sceg
  name: radarode_sceg
  n_points: 50
  backbone_channels: [128, 256]
  encoder_out_channels: 128
  encoder_out_time: 16
  out_len: 200
  use_deformable: true
  dropout: 0.2
  use_tau: false
  use_anchor_head: true

train:
  batch_size: 32
  epochs: 80
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 4
  anchor_weight: 1.0
