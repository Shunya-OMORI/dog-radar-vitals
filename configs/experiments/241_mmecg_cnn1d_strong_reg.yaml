# 241: 201/227/228/240系(ecg_cnn1d, MMECG連続波形回帰)は全試行でtrain corr 0.92-0.99
# に対しval corr 0.10-0.24という深刻な過学習を示していた(2026-08-05調査で確認、
# runs/20260725-011349・20260727-053109・20260727-053154・20260728-013817)。
# アーキテクチャは既にdilated conv + padding='same'でダウンサンプリングなし
# (時間分解能保持の教訓は満たしている)なので、正則化強化(dropout 0.1->0.4,
# weight_decay 1e-4->2e-3)のみを変えた一点検証。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  complex_input: false
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_seq2seq
  name: ecg_cnn1d
  in_channels: 50
  channels: 64
  n_layers: 6
  kernel_size: 15
  dropout: 0.4

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.002
  num_workers: 4
