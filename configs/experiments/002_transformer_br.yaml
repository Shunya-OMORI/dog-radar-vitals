# 002: 素朴なTransformer Encoderによる呼吸数(BR)予測のベースライン。
extends: ../base.yaml
task: br
model:
  family: deep
  name: transformer
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  n_outputs: 1
train:
  batch_size: 32
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 2
