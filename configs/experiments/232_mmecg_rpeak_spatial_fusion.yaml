# 232: RCG(mmWave, 50ch) + posXYZ -> R波heatmap推定。空間融合モデル(231のheatmap版)。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_fusion
  n_points: 50
  embed_dim: 32
  n_heads: 4
  n_attn_layers: 2

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
