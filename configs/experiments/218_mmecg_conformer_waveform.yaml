# 218: RCG(mmWave, 50ch) -> ECG波形推定。Conformer型（局所畳み込み+大域Self-Attention、
# 203のTransformer単体版に対する再設計）。warmup+cosineスケジューラも併用する
# （犬HR Transformerで学習率不足が未収束の原因だった013の教訓を踏襲、EXPERIMENTS.md参照）。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  complex_input: false
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_seq2seq
  name: ecg_conformer
  in_channels: 50
  d_model: 128
  conv_kernel_size: 15
  conv_layers: 3
  n_heads: 4
  n_transformer_layers: 4
  dim_feedforward: 256
  dropout: 0.1

train:
  batch_size: 32
  epochs: 50
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
  scheduler:
    type: warmup_cosine
    warmup_epochs: 5
