# 211: RCG(mmWave, 50ch) -> 窓内平均RR Interval[ms]。古典ML(Ridge)。
# 密な波形出力は古典回帰に不向きなため、古典ML系統だけRR Interval scalar回帰に限定する
# （AGENTS.md参照）。201-206と同一データ・split。
#
# 古典MLは3種(ridge/random_forest/gradient_boosting)を211-213に割り当てる。
seed: 42
task: rr_interval

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_classical_rr
  name: ridge
  alpha: 1.0
