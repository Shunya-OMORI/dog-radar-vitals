# 278: 274(R波単独教師のneurokit2本番モデル, F1 0.551/RR-MAE 10.69ms)と同一構成だが、
# RCG正規化前に[1,25]Hzバンドパスフィルタ(bandpass.py)をかける(apply_bandpass: true)。
# SST/波形回帰パイプラインでは既にバンドパスが試され悪化した記録(config253/254)が
# あるが、別パイプライン(SST変換)・旧ラベル(R/T混同あり)での結果であり、本パイプライン
# (生信号heatmap, 新ラベル)には直接適用できない。単一変数の原則(CLAUDE.md R4、
# 変更点はdata.apply_bandpassのみ)で改めて検証する。まず8epochプローブ(R2)。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  rpeak_detector: neurokit
  apply_bandpass: true
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2

train:
  batch_size: 32
  epochs: 8
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
