# 276: 274(neurokitラベルで学習した本番GNN, F1 0.551/RR-MAE 10.69ms)と同一構成だが、
# 教師heatmapをR波単独ではなくR波+T波の統合(rpeak_detector: neurokit_rt)にする。
# ユーザ発案(2026-08-07): heatmapモデルは1心拍につき隣接する2つの山(R波+T波)を出しがち
# だった。「T波を予測するな」という一貫しない教師を与え続けるより、R波・T波の両方を
# 正解として与え、どちらがRかの選別は後処理(既知のR→T間隔=QT間隔の規則性、
# extract_peaks_paired_dedup/rhythmicが使える)に任せる方が学習課題として一貫するはず、
# という仮説。単一変数の原則(CLAUDE.md R4)により、変更点はdata.rpeak_detectorのみ。
# まず8epochプローブで見込みを確認する(R2)。評価は既存の後処理(paired_dedup/rhythmic/
# adaptive_searchback)をこのheatmapに適用し、R波単独教師の274と比較する。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  rpeak_detector: neurokit_rt
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2

train:
  batch_size: 32
  epochs: 8
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
