# 242: radarODE(Zhang et al. 2024/2025, arXiv:2408.01672)のSCEG(単一拍ECG再構成)を再現。
#
# 我々と全く同じ91トライアル・11被験者データで、原著が単一拍評価でPCC(相関)87.9%
# (MMECG再現)〜92.6%(radarODE自身)を達成したことを受け、同じ評価粒度(単一拍単位の
# RMSE/PCC)で直接比較するための実装。詳細は
# `reports/mmecg_comparison/prior_work_accuracy_comparison.md`「radarODE再現」節参照。
#
# split・被験者は既存の201/240/241と揃える(原著は11-fold leave-one-subject-out CVだが、
# まずは単一splitで動作確認してから、後段でCVへ拡張する方針は101/102以来の育て方と同じ)。
seed: 42
task: ecg

data:
  raw_root: data/raw
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_radarode_sceg
  name: radarode_sceg
  n_points: 50
  backbone_channels: [128, 256, 512]
  encoder_out_channels: 128
  encoder_out_time: 8
  out_len: 200

train:
  batch_size: 32
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 2
