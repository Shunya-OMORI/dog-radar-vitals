# 257: 256と全く同じ設定(25epoch、凡庸CNN)だがuse_temporal_shift=falseの対照実験。
# 247は80epoch学習だったため、256(25epoch)と公平に比較するにはepoch数を揃えた対照が必要。
seed: 42
task: ecg

data:
  raw_root: data/raw
  norm_scope: trial
  apply_bandpass: false
  use_context_window: false
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_singlecycle_cnn
  name: singlecycle_cnn
  n_points: 50
  channels: 64
  n_layers: 6
  kernel_size: 15
  dropout: 0.1
  out_len: 200
  use_temporal_shift: false

train:
  batch_size: 32
  epochs: 25
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 4
