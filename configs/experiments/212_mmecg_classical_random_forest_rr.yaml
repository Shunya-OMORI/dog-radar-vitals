# 212: RCG(mmWave, 50ch) -> 窓内平均RR Interval[ms]。古典ML(RandomForest)。211と対。
seed: 42
task: rr_interval

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_classical_rr
  name: random_forest
  n_estimators: 200
  max_depth: 8
  random_state: 42
  n_jobs: -1
