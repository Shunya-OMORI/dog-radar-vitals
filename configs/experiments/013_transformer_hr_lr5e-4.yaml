# 013: Transformer(HR)の学習率対照実験その1。001はval_maeが100epoch終了時点でも
# 単調減少中で未収束だった（EXPERIMENTS.md参照）。lrを5倍(1e-4 -> 5e-4)にして収束を速める。
extends: ../base.yaml
task: hr
model:
  family: deep
  name: transformer
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  n_outputs: 1
train:
  batch_size: 32
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
