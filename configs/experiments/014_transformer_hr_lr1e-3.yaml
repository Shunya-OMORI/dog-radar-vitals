# 014: Transformer(HR)の学習率対照実験その2。001に対しlrを10倍(1e-4 -> 1e-3)。
extends: ../base.yaml
task: hr
model:
  family: deep
  name: transformer
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  n_outputs: 1
train:
  batch_size: 32
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 2
