# 273: 236と同一構成だが、R波の正解ラベルをneurokit2(恒久対応)で再検出する。
# ユーザ指摘(2026-08-06): 旧来のdetect_r_peaks(z-score+find_peaks)がT波を第二の
# R波候補として検出したり、真のR波を見逃したりすることが確認された。
# まずは8epochのプローブで見込みを確認してからフル学習に進む(CLAUDE.md R2)。
seed: 42
task: ecg

data:
  raw_root: data/raw
  window_sec: 4
  stride_sec: 2
  rpeak_detector: neurokit
  subjects:
    train: [1, 2, 5, 9, 10, 13, 14]
    val: [16]
    test: [17, 29, 30]

model:
  family: mmecg_spatial_seq2seq
  name: rpeak_spatial_gnn
  n_points: 50
  embed_dim: 32
  k_neighbors: 6
  n_gat_layers: 2

train:
  batch_size: 32
  epochs: 8
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 2
